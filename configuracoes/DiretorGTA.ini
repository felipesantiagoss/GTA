; Configuração editável fora da pasta do jogo. Aplicar com F4 > Reload().
[Teclas]
Montar=F6
Acao=F7
Limpar=F10
ProximoPlano=F5
TrocarAtorCamera=J
CameraLivre=F11
MarcarCamera=Insert
MarcarLocal=F3
ProximaCena=PageDown
CenaAnterior=PageUp
ReiniciarTomada=Delete
PrepararGravacao=Home
OrganizarNovamente=End
ProximoLocal=L
LocalAnterior=K
ProximoTeste=N
ProximoEpisodio=O
ProximaSubtomada=T

[Controle]
; Controle reconhecido pelo GTA: segure R1 + direcional baixo por um segundo.
MarcarLocal=true

[Interface]
Mensagens=true

; Legendas desenhadas pelo Diretor, independentes da opção de legendas do GTA.
[Legendas]
Exibir=false
MostrarNarracao=false
EscalaFonte=0.45

[Camera]
NomeMarca=meu_plano

[Local]
NomeMarca=TESTE_AMBIENTE

[Ambiente]
RaioLimpeza=40
TimeoutLocalMs=10000

; As cenas são lidas fora de Program Files, sem bibliotecas extras.
[Pastas]
Cenas=%USERPROFILE%\GTA_Diretor\cenas

[Cena]
Inicial=teste_json.json
PilotoAoIniciar=false

; Primeiro MP4: F6 monta EP01_C08. O seleciona a sequência de produção.
[Fila]
Arquivo=

; Poucas entidades por padrão; carregamento sem travar o jogo.
[Limites]
MaxPersonagens=5
TimeoutModeloMs=5000
TimeoutAnimacaoMs=5000

; Home prepara uma tomada, depois Win+Alt+R e F7. Pare com Win+Alt+R ao fim.
; A automação do atalho permanece desabilitada até a primeira organização real.
[Gravacao]
Habilitada=true
Modo=manual
AutomatizarAposPrimeira=true
PastaCapturas=%USERPROFILE%\Videos\Captures
Python=%USERPROFILE%\AppData\Local\Programs\Python\Python312\python.exe

[Elenco]
; Geração autorizada pelo usuário. Guarda rosto/roupas reais para reutilizar.
GerarAoMontar=true
Semente=20601003
